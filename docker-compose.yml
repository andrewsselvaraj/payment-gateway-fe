# Runs the frontend against a backend already started from payment-gateway-microservices
# (`docker compose up` there exposes the api-gateway on localhost:8080).
services:
  payment-gateway-fe:
    build: .
    ports:
      - "4200:8080"
    environment:
      API_GATEWAY_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
